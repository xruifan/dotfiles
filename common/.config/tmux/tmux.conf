set-option -g default-shell /bin/zsh

unbind r
bind-key r source-file ~/.config/tmux/tmux.conf

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g prefix C-s
# Send the prefix key itself to the focused program. This is the standard
# double-prefix passthrough: it lets you reach a nested tmux/screen, or use
# C-s inside a program that binds it (zsh/emacs forward i-search, etc.).
# tmux-resurrect's save/restore keys are moved to prefix + S / prefix + R
# below, so they no longer collide with this binding.
bind-key C-s send-prefix
set-option -g mouse on
set-option -g history-limit 5000
set-option -g renumber-windows on
set-option -g status-position top
set-option -g status-left ' #{?client_prefix,#[reverse]  #[noreverse] ,    }'
set-option -g status-style bg=green,fg=black,bold

# Allow passthrough
set-option -gq allow-passthrough on

# Allow copying accross ssh
set-option -s set-clipboard on

# Pane title
set-window-option -g window-status-current-style bg=yellow
set-window-option -g window-status-current-format '  [#I]#W '
set-window-option -g window-status-format '#{?window_last_flag,  [#I]#W , [#I]#W }'

# Vi navigation
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Uptime
set -g status-right " #(uptime | awk -F, '{print $1,$2}' | sed 's/:/h /g;s/^.*up *//; s/ *[0-9]* user.*//;s/[0-9]$/&m/;s/ day. */d /g') "

# Plugins
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-resurrect keys (C-s is reserved for send-prefix above):
#   prefix + S  save the current session (windows, panes, layouts)
#   prefix + R  restore the last saved session
# These must be set before TPM sources the plugin below.
set-option -g @resurrect-save 'S'
set-option -g @resurrect-restore 'R'

# Optional: automatically save every 15 minutes and restore on tmux start.
# Uncomment these, then press prefix + I to install the plugin.
# set-option -g @plugin 'tmux-plugins/tmux-continuum'
# set-option -g @continuum-restore 'on'
# set-option -g @continuum-save-interval '15'

# Optional: also save pane scrollback (larger/slower save files).
# set-option -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
